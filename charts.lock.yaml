# Pinned chart sources for citadel.
#
# One entry per chart archive that this repository serves. tools/fetch-charts.mjs
# reads this file, downloads each archive, checks it against digest, writes it to
# charts/ and rebuilds charts/index.yaml from the archives on disk.
#
#   node tools/fetch-charts.mjs           fetch what is missing
#   node tools/fetch-charts.mjs --check   verify, write nothing
#   node tools/fetch-charts.mjs --update  re-download and refresh digests
#
# Fields
#   name       chart name, and the key it gets in index.yaml
#   version    chart version inside Chart.yaml, and the filename version
#   tag        upstream ref that Argo CD pins (targetRevision). Equal to version
#              for http sources, where Helm uses the version itself.
#   source     http = a tar index repository, oci = an OCI registry artifact
#   repository index repository, or the OCI repository path
#   url        direct archive url for http sources
#   registry   OCI registry for oci sources
#   digest     sha256 of the archive as stored here, as a lowercase hex string
#   pinnedBy   the Argo CD Application that installs this chart
#
